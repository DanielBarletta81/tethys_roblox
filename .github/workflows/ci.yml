name: Portable source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum-pinned official Luau
        run: python3 tools/install_luau.py
      - name: Check repository, compile Luau, and run shared policy cases
        run: python3 tools/ci_checks.py --luau-dir .tooling/luau-0.741
